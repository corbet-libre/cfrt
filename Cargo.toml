[package]
name = "cfrt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Reusable verified-effort integrations with bounded costs and caller-owned consumption"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cfrt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
hex = "0.4"
altcha = "1"
cfbk = { git = "https://git.corbet.ch/corbet-libre/cfbk", branch = "main" }
http = "1"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
futures = "0.3"
